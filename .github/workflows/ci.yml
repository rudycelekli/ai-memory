name: AI memory1499 native repair qualification
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
    - name: Normalize only owned runner checkout newlines
      shell: bash
      run: 'git config --global core.autocrlf false

        git config --global core.eol lf'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: akitaonrails/ai-memory
        ref: 5519b89cc653bec4cfccbb770c6b4e5dcfcda759
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: '1.95'
        components: rustfmt,clippy
    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      with:
        shared-key: ai-native-1.95
    - name: Apply frozen candidate and verify all blobs
      shell: python
      run: 'import base64,hashlib,json,os,pathlib,subprocess

        M={''base'': ''5519b89cc653bec4cfccbb770c6b4e5dcfcda759'', ''patch_sha256'':
        ''5bd463517f68ab947a1f58875dd7fd1478092ec7f80eedacc612197c39232486'', ''paths'':
        [''CHANGELOG.md'', ''crates/ai-memory-store/src/migrations.rs''], ''baseline_run'':
        ''https://github.com/rudycelekli/ai-memory/actions/runs/39540810795'', ''baseline'':
        ''Actual Rust/refinery3publicchecksumcontrols passed before expected DivergentVersion
        reopen failure'', ''state'': ''PRIVATE_CANDIDATE_NOT_QUALIFIED'', ''files'':
        {''CHANGELOG.md'': ''1bf195e0a27e840cbd7bb5bb725c7aa4d4f17e9bbdbc9caf7677e7221ffe3f67'',
        ''crates/ai-memory-store/src/migrations.rs'': ''269388728e994c049fdf1e543553092309f03f8e829783b868d11f53dc28a244''},
        ''local_format_tool'': ''rustfmt1.8.0-stable01f6ddf7582026-02-11; hostedRust1.95
        fmt gate pending'', ''independent_review'': ''accepted_new_lane found no code
        blocker; added requested actual CRLF-SQL-created database/schema/data/integrity/idempotency
        regression''}

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==M[''base'']

        assert not subprocess.check_output([''git'',''status'',''--porcelain''],text=True).strip()

        raw=base64.b64decode('''');assert
        hashlib.sha256(raw).hexdigest()==M[''patch_sha256'']

        f=pathlib.Path(os.environ[''RUNNER_TEMP''])/''candidate.patch'';f.write_bytes(raw)

        assert [x.split(''\t'',2)[2] for x in subprocess.check_output([''git'',''apply'',''--numstat'',str(f)],text=True).splitlines()]==M[''paths'']

        subprocess.run([''git'',''apply'',''--check'',str(f)],check=True);subprocess.run([''git'',''apply'',str(f)],check=True)

        for name,h in M[''files''].items(): assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==h

        '
    - name: Strict native migration regressions
      shell: bash
      run: "set -euo pipefail\ncargo test --locked -p ai-memory-store --lib migrations::tests::\
        \ -- --nocapture 2>&1 | tee \"$RUNNER_TEMP/migrations.log\"\npython - <<'CHECK'\n\
        import pathlib,os,re\ns=pathlib.Path(os.environ[\"RUNNER_TEMP\"],\"migrations.log\"\
        ).read_text()\nfor name in [\"review_windows_crlf_history_opens_without_weakening_divergence\"\
        ,\"windows_crlf_repair_preserves_schema_data_and_is_idempotent\",\"windows_crlf_repair_refuses_unknown_sql_and_wrong_names\"\
        ,\"windows_crlf_repair_rolls_back_history_on_write_failure\",\"windows_crlf_repair_preserves_a_schema_created_from_crlf_sql\"\
        ,\"only_the_original_v62_checksum_is_repaired\"]:\n assert re.search(r\"test\
        \ migrations::tests::\"+name+r\" \\.\\.\\. ok\",s),name\nassert \"0 failed;\
        \ 0 ignored;\" in s\nCHECK"
    - name: Required formatting
      shell: bash
      run: 'cargo fmt --all -- --check

        git diff --check'
    - name: Required full workspace clippy
      if: runner.os == 'Linux'
      shell: bash
      run: 'set -euo pipefail

        cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee
        "$RUNNER_TEMP/clippy.log"'
    - name: Full native workspace required tests
      shell: bash
      run: 'set -euo pipefail

        cargo test --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/workspace.log"'
    - name: Workspace doctests
      if: runner.os == 'Linux'
      shell: bash
      run: 'set -euo pipefail

        cargo test --locked --workspace --doc 2>&1 | tee "$RUNNER_TEMP/doctests.log"'
    - name: Dependency policy
      if: runner.os == 'Linux'
      uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
      with:
        log-level: warn
        command: check
        arguments: --all-features
    - name: Final exact candidate identity
      if: always()
      shell: python
      run: 'import pathlib,hashlib,subprocess

        M={''base'': ''5519b89cc653bec4cfccbb770c6b4e5dcfcda759'', ''patch_sha256'':
        ''5bd463517f68ab947a1f58875dd7fd1478092ec7f80eedacc612197c39232486'', ''paths'':
        [''CHANGELOG.md'', ''crates/ai-memory-store/src/migrations.rs''], ''baseline_run'':
        ''https://github.com/rudycelekli/ai-memory/actions/runs/39540810795'', ''baseline'':
        ''Actual Rust/refinery3publicchecksumcontrols passed before expected DivergentVersion
        reopen failure'', ''state'': ''PRIVATE_CANDIDATE_NOT_QUALIFIED'', ''files'':
        {''CHANGELOG.md'': ''1bf195e0a27e840cbd7bb5bb725c7aa4d4f17e9bbdbc9caf7677e7221ffe3f67'',
        ''crates/ai-memory-store/src/migrations.rs'': ''269388728e994c049fdf1e543553092309f03f8e829783b868d11f53dc28a244''},
        ''local_format_tool'': ''rustfmt1.8.0-stable01f6ddf7582026-02-11; hostedRust1.95
        fmt gate pending'', ''independent_review'': ''accepted_new_lane found no code
        blocker; added requested actual CRLF-SQL-created database/schema/data/integrity/idempotency
        regression''}

        for name,h in M[''files''].items(): assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==h

        assert subprocess.check_output([''git'',''diff'',''--name-only''],text=True).splitlines()==M[''paths'']

        assert subprocess.check_output([''git'',''diff'',''--cached'',''--name-only''])==b''''

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: migration1499-${{ matrix.os }}-${{ github.run_id }}
        path: '${{ runner.temp }}/*.log

          ${{ runner.temp }}/candidate.patch'
        if-no-files-found: error

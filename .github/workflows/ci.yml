name: Diagnose unchanged sidebar Windows recency assertion
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'rudycelekli/ai-memory'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: baseline
          sha: 11ab1003d9ef3788f5fc40b87fff54abf7f17dc0
        - label: pr1474
          sha: 7f32bb284ded2b88af5bbe493d2c54536821eb89
    env:
      SOURCE_SHA: ${{ matrix.sha }}
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -D warnings
    steps:
    - name: Preserve canonical LF checkout
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: akitaonrails/ai-memory
        ref: ${{ matrix.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: '1.95'
    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      with:
        shared-key: dotted-pathext-rust1.95
    - name: Guard exact unchanged sidebar and store source
      shell: bash
      run: |-
        python3 - <<'PY'
        import os, pathlib, subprocess, json
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sidebar-diagnostic';root.mkdir()
        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        assert head==os.environ['SOURCE_SHA']
        assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
        EXPECTED={'crates/ai-memory-web/tests/suite/routes.rs': '8fd6afdb03a5a5638a973d51da5bdb99dbf6b512', 'crates/ai-memory-web/src/routes/project.rs': '2fbf8ab3f0d1a0bc10b0671eac5cc0481ea5debe', 'crates/ai-memory-store/src/reader.rs': '7f79285daa59cc9a8de81b397fe4b4fc27214049', 'crates/ai-memory-store/src/ops.rs': '31bae2cc26871de9d2d9933819f6f8140c866edf'}
        actual={name:subprocess.check_output(['git','rev-parse','HEAD:'+name],text=True).strip() for name in EXPECTED}
        assert actual==EXPECTED
        (root/'source-identity.json').write_text(json.dumps({'head':head,'unchanged_blobs':actual,'source_patch_applied':False},indent=2))
        assert subprocess.check_output(['rustc','--version'],text=True).startswith('rustc 1.95.')

        PY
    - name: Bounded ten actual unchanged Windows test repetitions
      shell: bash
      run: |-
        python3 - <<'PY'
        def evaluate(log, code):
            import re
            owner='integration::routes::sidebar_folders_show_five_newest_with_a_link_to_the_rest'
            assert re.findall(r'^running (\d+) tests?\s*$',log,re.M)==['1']
            ok=re.findall(r'^test (\S+) \.\.\. ok\s*$',log,re.M)
            failed=re.findall(r'^test (\S+) \.\.\. FAILED\s*$',log,re.M)
            assert not any(s in log for s in ['could not compile','failed to get ','failed to download','error[E','unresolved import'])
            if code==0:
                assert ok==[owner] and not failed
                assert re.findall(r'^test result: ok\. 1 passed; 0 failed;.*$',log,re.M)
                return 'PASS'
            assert code==101 and failed==[owner] and not ok
            assert re.findall(r'^test result: FAILED\. 0 passed; 1 failed;.*$',log,re.M)
            assert 'side.contains("Big 5") && !side.contains("Big 0")' in log
            return 'ORIGINAL_SIDEBAR_ASSERTION_FAILURE'

        import os,pathlib,subprocess,json
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sidebar-diagnostic'
        clean={k:v for k,v in os.environ.items() if k not in {'GITHUB_TOKEN','GH_TOKEN'} and not k.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_'))}
        results=[]
        for iteration in range(10):
            args=['cargo','test','--locked','-p','ai-memory-web','--lib','integration::routes::sidebar_folders_show_five_newest_with_a_link_to_the_rest','--','--exact']
            r=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,env=clean)
            (root/f'focused-{iteration+1}.log').write_text(r.stdout)
            try:classification=evaluate(r.stdout,r.returncode)
            except AssertionError:classification='UNEXPECTED_INFRASTRUCTURE_OR_OTHER_FAILURE'
            results.append({'iteration':iteration+1,'exit':r.returncode,'classification':classification})
            print(results[-1],flush=True)
        (root/'results.json').write_text(json.dumps(results,indent=2))
        assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
        (root/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
        # Diagnostic failures stay failures; this is not a publication qualification.
        raise SystemExit(any(x['exit']!=0 for x in results))

        PY
    - name: Preserve results even on failure
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sidebar-diagnostic-${{ matrix.label }}-${{ github.run_id }}
        path: ${{ runner.temp }}/sidebar-diagnostic/
        if-no-files-found: error

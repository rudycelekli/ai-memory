name: AI memory1499 CRLF migration native baseline
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: akitaonrails/ai-memory
        ref: 5519b89cc653bec4cfccbb770c6b4e5dcfcda759
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: '1.95'
    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      with:
        shared-key: ai-native-1.95
    - name: Apply only frozen regression test
      shell: python
      run: 'import base64,hashlib,subprocess,pathlib,os

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''5519b89cc653bec4cfccbb770c6b4e5dcfcda759''

        p=pathlib.Path(''crates/ai-memory-store/src/migrations.rs'');assert hashlib.sha256(p.read_bytes()).hexdigest()==''1ac41b8faac7f63063de3b103ce31ff46f7fcb7a150cf94e287dcfadd0226fd5''

        raw=base64.b64decode('''');assert
        hashlib.sha256(raw).hexdigest()==''3bb5fee8a7a7b632c3f0c05850def183f4b77c1305cd71c0dd51f79e315d48f5''

        f=pathlib.Path(os.environ[''RUNNER_TEMP''])/''baseline.patch'';f.write_bytes(raw)

        subprocess.run([''git'',''apply'',''--check'',str(f)],check=True);subprocess.run([''git'',''apply'',str(f)],check=True)

        assert hashlib.sha256(p.read_bytes()).hexdigest()==''f1b4d11cda2ebae782426988634cd13d9573430c38c0b3e4ff35149c6bb6f046''

        '
    - name: Real migration history reopen
      run: 'set +e

        cargo test --locked -p ai-memory-store --lib migrations::tests::review_windows_crlf_history_opens_without_weakening_divergence
        -- --exact --nocapture > "$RUNNER_TEMP/baseline.log" 2>&1

        result=$?

        set -e

        cat "$RUNNER_TEMP/baseline.log"

        test "$result" -ne 0

        '
    - name: Require actual semantic failure and exact source
      shell: python
      run: 'import pathlib,os,hashlib,subprocess

        s=pathlib.Path(os.environ[''RUNNER_TEMP''],''baseline.log'').read_text()

        assert ''running 1 test'' in s and ''WINDOWS_CRLF_HISTORY_REOPEN_REFUSED''
        in s

        assert ''test result: FAILED. 0 passed; 1 failed;'' in s

        assert ''DivergentVersion'' in s

        assert hashlib.sha256(pathlib.Path(''crates/ai-memory-store/src/migrations.rs'').read_bytes()).hexdigest()==''f1b4d11cda2ebae782426988634cd13d9573430c38c0b3e4ff35149c6bb6f046''

        assert subprocess.check_output([''git'',''diff'',''--name-only''],text=True).splitlines()==[''crates/ai-memory-store/src/migrations.rs'']

        print(''Actual refinery migration history reopen semantic failure reproduced;
        no fix qualified'')

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: migration1499-native-baseline
        path: '${{ runner.temp }}/baseline.log

          ${{ runner.temp }}/baseline.patch'
        if-no-files-found: error

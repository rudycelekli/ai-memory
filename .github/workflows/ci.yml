name: Dotted Windows PATHEXT qualification
permissions:
  contents: read
concurrency:
  group: dotted-pathext-qualification
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
  TAILWIND_BUILD: '1'
jobs:
  baseline:
    if: github.repository == 'rudycelekli/ai-memory'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: Preserve canonical LF source
      run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: akitaonrails/ai-memory
        ref: 11ab1003d9ef3788f5fc40b87fff54abf7f17dc0
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: '1.95'
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      with:
        shared-key: dotted-pathext-rust1.95
    - name: Verify and apply reviewed packet
      env:
        MODE: baseline
        BASE: ${{ inputs.base }}
        PATCH_BASE64: ${{ inputs.patch_base64 }}
        PATCH_SHA256: ${{ inputs.patch_sha256 }}
        TESTS_PATCH_BASE64: ${{ inputs.tests_patch_base64 }}
        TESTS_PATCH_SHA256: ${{ inputs.tests_patch_sha256 }}
      run: 'python - <<''PY''

        import base64,hashlib,json,os,pathlib,subprocess

        M={''base'': ''11ab1003d9ef3788f5fc40b87fff54abf7f17dc0'', ''baseline_tests'': [{''owner'': ''commands::run::tests::windows_dotted_harness_name_launches_its_own_pathext_sibling'', ''command'': [''cargo'', ''test'', ''--locked'', ''-p'', ''ai-memory-cli'', ''--bin'', ''ai-memory'', ''commands::run::tests::windows_dotted_harness_name_launches_its_own_pathext_sibling'', ''--'', ''--exact'', ''--nocapture''], ''assertion_marker'': ''PATHEXT must preserve the complete dotted harness name'', ''independent_control'': ''NATIVE_WINDOWS_CONTROL=intended-harness''}], ''candidate'': {''sha256'': ''896389fbda9b427fae895244feb7a632aaa548835d87f895fa41f5bcf490bc02'', ''bytes'': 3782, ''paths'': [''CHANGELOG.md'', ''crates/ai-memory-cli/src/commands/run.rs'']}, ''tests'': {''sha256'': ''31d40fdf4b189ad996af347630dc8e3cca310cb281cad4014e9d39aae54197d9'', ''bytes'': 2388, ''paths'': [''crates/ai-memory-cli/src/commands/run.rs'']}}

        mode=os.environ[''MODE'']; key=''tests'' if mode==''baseline'' else ''candidate''; item=M[key]

        assert os.environ[''BASE'']==M[''base'']

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==M[''base'']

        assert not subprocess.check_output([''git'',''status'',''--porcelain''],text=True).strip()

        raw=base64.b64decode(os.environ[''TESTS_PATCH_BASE64'' if mode==''baseline'' else ''PATCH_BASE64''],validate=True)

        assert len(raw)==item[''bytes''] and hashlib.sha256(raw).hexdigest()==item[''sha256'']

        assert os.environ[''TESTS_PATCH_SHA256'' if mode==''baseline'' else ''PATCH_SHA256'']==item[''sha256'']

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/''ai-memory-qualification''; root.mkdir(exist_ok=True)

        p=root/''applied.patch''; p.write_bytes(raw)

        paths=[s.split(''\t'',2)[2] for s in subprocess.check_output([''git'',''apply'',''--numstat'',str(p)],text=True).splitlines()]

        assert len(paths)==len(set(paths)) and set(paths)==set(item[''paths''])

        subprocess.run([''git'',''apply'',''--check'',str(p)],check=True); subprocess.run([''git'',''apply'',str(p)],check=True)

        subprocess.run([''git'',''diff'',''--check''],check=True)

        (root/''metadata.json'').write_text(json.dumps({''base'':M[''base''],''mode'':mode,''patch_sha256'':item[''sha256''],''paths'':paths,''workflow_commit'':os.environ[''GITHUB_SHA''],''source_commit_pushed'':False},indent=2))


        PY

        '
    - name: Record compiler and resources
      run: 'rustc --version

        cargo --version

        rustc --version | grep ''^rustc 1.95.''

        df -h .

        '
    - name: Require exact semantic baseline failures
      run: "python - <<'PY'\n\"\"\"Semantic baseline validator shared verbatim with the generated workflow.\"\"\"\nimport re\n\ndef validate_baseline_result(spec, returncode, log):\n    owner = spec['owner']\n    marker = spec['assertion_marker']\n    assert returncode == 101, 'expected Cargo test failure exit 101'\n    assert owner and marker, 'reviewed semantic assertion required'\n    assert re.findall(r'^running (\\d+) tests?\\s*$', log, re.M) == ['1'], 'exactly one native test must be selected'\n    failed = re.findall(r'^test (\\S+) \\.\\.\\. FAILED\\s*$', log, re.M)\n    assert failed == [owner], 'only the exact requested native test may fail'\n    summaries = re.findall(r'^test result: (.+)$', log, re.M)\n    assert len(summaries) == 1 and re.fullmatch(r'FAILED\\. 0 passed; 1 failed; \\d+ ignored; \\d+ measured; \\d+ filtered out; finished in [0-9.]+s', summaries[0]), 'exact one-failure native summary required'\n    panic_owners = re.findall(r\"^thread '([^']+)'(?: \\(\\d+\\))? panicked at .+$\", log, re.M)\n    assert panic_owners == [owner], 'one panic owned by requested native test required'\n    assert marker in log, 'expected semantic assertion not observed'\n    forbidden = ('could not compile', 'error[E', 'failed to run custom build command', 'failed to download', 'failed to get ', 'process didn\\'t exit successfully', 'signal: ', 'failed to load', 'unresolved import')\n    assert not any(item in log for item in forbidden), 'compiler or infrastructure failure is not regression proof'\n    return {'owner': owner, 'returncode': returncode, 'semantic_assertion': marker}\n\nimport json,os,pathlib,subprocess\nSPECS=[{'owner': 'commands::run::tests::windows_dotted_harness_name_launches_its_own_pathext_sibling', 'command': ['cargo', 'test', '--locked', '-p', 'ai-memory-cli', '--bin', 'ai-memory', 'commands::run::tests::windows_dotted_harness_name_launches_its_own_pathext_sibling', '--', '--exact', '--nocapture'], 'assertion_marker': 'PATHEXT must preserve the complete dotted harness name', 'independent_control': 'NATIVE_WINDOWS_CONTROL=intended-harness'}]\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification'\nclean={k:v for k,v in os.environ.items() if k not in {'GITHUB_TOKEN','GH_TOKEN'} and not k.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_'))}\nresults=[]\nfor i,spec in enumerate(SPECS):\n result=subprocess.run(spec['command'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=2100,env=clean)\n (root/f'baseline-{i}.log').write_text(result.stdout); print(result.stdout)\n assert spec['independent_control'] in result.stdout\n results.append(validate_baseline_result(spec,result.returncode,result.stdout))\n(root/'baseline-results.json').write_text(json.dumps(results,indent=2))\n\nPY\n"
    - name: Preserve native receipts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dotted-pathext-baseline-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ai-memory-qualification/
        if-no-files-found: error
        retention-days: 14
    defaults:
      run:
        shell: bash
  candidate:
    if: github.repository == 'rudycelekli/ai-memory'
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: akitaonrails/ai-memory
        ref: 11ab1003d9ef3788f5fc40b87fff54abf7f17dc0
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: '1.95'
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      with:
        shared-key: dotted-pathext-rust1.95
    - name: Verify and apply reviewed packet
      env:
        MODE: candidate
        BASE: ${{ inputs.base }}
        PATCH_BASE64: ${{ inputs.patch_base64 }}
        PATCH_SHA256: ${{ inputs.patch_sha256 }}
        TESTS_PATCH_BASE64: ${{ inputs.tests_patch_base64 }}
        TESTS_PATCH_SHA256: ${{ inputs.tests_patch_sha256 }}
      run: 'python3 - <<''PY''

        import base64,hashlib,json,os,pathlib,subprocess

        M={''base'': ''11ab1003d9ef3788f5fc40b87fff54abf7f17dc0'', ''baseline_tests'': [{''owner'': ''commands::run::tests::windows_dotted_harness_name_launches_its_own_pathext_sibling'', ''command'': [''cargo'', ''test'', ''--locked'', ''-p'', ''ai-memory-cli'', ''--bin'', ''ai-memory'', ''commands::run::tests::windows_dotted_harness_name_launches_its_own_pathext_sibling'', ''--'', ''--exact'', ''--nocapture''], ''assertion_marker'': ''PATHEXT must preserve the complete dotted harness name'', ''independent_control'': ''NATIVE_WINDOWS_CONTROL=intended-harness''}], ''candidate'': {''sha256'': ''896389fbda9b427fae895244feb7a632aaa548835d87f895fa41f5bcf490bc02'', ''bytes'': 3782, ''paths'': [''CHANGELOG.md'', ''crates/ai-memory-cli/src/commands/run.rs'']}, ''tests'': {''sha256'': ''31d40fdf4b189ad996af347630dc8e3cca310cb281cad4014e9d39aae54197d9'', ''bytes'': 2388, ''paths'': [''crates/ai-memory-cli/src/commands/run.rs'']}}

        mode=os.environ[''MODE'']; key=''tests'' if mode==''baseline'' else ''candidate''; item=M[key]

        assert os.environ[''BASE'']==M[''base'']

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==M[''base'']

        assert not subprocess.check_output([''git'',''status'',''--porcelain''],text=True).strip()

        raw=base64.b64decode(os.environ[''TESTS_PATCH_BASE64'' if mode==''baseline'' else ''PATCH_BASE64''],validate=True)

        assert len(raw)==item[''bytes''] and hashlib.sha256(raw).hexdigest()==item[''sha256'']

        assert os.environ[''TESTS_PATCH_SHA256'' if mode==''baseline'' else ''PATCH_SHA256'']==item[''sha256'']

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/''ai-memory-qualification''; root.mkdir(exist_ok=True)

        p=root/''applied.patch''; p.write_bytes(raw)

        paths=[s.split(''\t'',2)[2] for s in subprocess.check_output([''git'',''apply'',''--numstat'',str(p)],text=True).splitlines()]

        assert len(paths)==len(set(paths)) and set(paths)==set(item[''paths''])

        subprocess.run([''git'',''apply'',''--check'',str(p)],check=True); subprocess.run([''git'',''apply'',str(p)],check=True)

        subprocess.run([''git'',''diff'',''--check''],check=True)

        (root/''metadata.json'').write_text(json.dumps({''base'':M[''base''],''mode'':mode,''patch_sha256'':item[''sha256''],''paths'':paths,''workflow_commit'':os.environ[''GITHUB_SHA''],''source_commit_pushed'':False},indent=2))


        PY

        '
    - name: Record compiler and resources
      run: 'rustc --version

        cargo --version

        rustc --version | grep ''^rustc 1.95.''

        df -h .

        '
    - name: Exact preflight full-index identity
      env:
        IDENTITY_PHASE: preflight
        EXPECTED_SHA256: ${{ inputs.patch_sha256 }}
      run: "python3 - <<'PY'\nimport hashlib,json,os,pathlib,stat,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification';root.mkdir(exist_ok=True)\nphase=os.environ.get('IDENTITY_PHASE','final')\ncanonical=subprocess.check_output(['git','diff','--binary','--full-index'])\nuntracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()\nfor file in untracked:\n result=subprocess.run(['git','diff','--no-index','--binary','--full-index','--','/dev/null',file],capture_output=True)\n assert result.returncode==1, 'failed to inspect new file'\n canonical+=result.stdout\n(root/(phase+'.patch')).write_bytes(canonical)\nstatus=subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True)\n(root/(phase+'-status.txt')).write_text(status)\npaths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()+untracked\nfiles={}\nfor name in sorted(set(paths)):\n p=pathlib.Path(name)\n if not p.exists() and not p.is_symlink(): files[name]={'deleted':True};continue\n data=os.readlink(p).encode()if p.is_symlink()else p.read_bytes()\n files[name]={'sha256':hashlib.sha256(data).hexdigest(),'mode':oct(stat.S_IMODE(p.lstat().st_mode)),'bytes':len(data),'symlink':p.is_symlink()}\n(root/(phase+'-source-files.json')).write_text(json.dumps(files,indent=2)+chr(10))\nactual=hashlib.sha256(canonical).hexdigest()\n(root/(phase+'-patch-identity.json')).write_text(json.dumps({'sha256':actual,'expected':os.environ['EXPECTED_SHA256'],'serializer':'git diff --binary --full-index plus untracked no-index binary full-index','including_untracked_files':True},indent=2)+chr(10))\nsubprocess.run(['git','diff','--check'],check=True)\nassert actual==os.environ['EXPECTED_SHA256'], 'qualification patch identity mismatch; actual patch/status/source hashes retained'\nprint(phase+' reviewed patch SHA-256:',actual)\n\nPY\n"
    - name: fmt
      env:
        QUALIFICATION_COMMAND: cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/ai-memory-qualification/fmt.log"
      run: "python3 - <<'PY'\nimport os\nfor key in list(os.environ):\n if key in {'GITHUB_TOKEN','GH_TOKEN'}or key.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_')):\n  os.environ.pop(key,None)\nos.execvp('bash',['bash','-euo','pipefail','-c',os.environ['QUALIFICATION_COMMAND']])\n\nPY\n"
    - name: clippy

          subprocess.run(['git','diff','--check'],check=True)
          (root/'metadata.json').write_text(json.dumps({'base':M['base'],'mode':mode,'patch_sha256':item['sha256'],'paths':paths,'workflow_commit':os.environ['GITHUB_SHA'],'source_commit_pushed':False},indent=2))
          
          PY
      - name: Record compiler and resources
        run: |
          rustc --version
          cargo --version
          rustc --version | grep '^rustc 1.95.'
          df -h .
      - name: Exact preflight full-index identity
        env:
          IDENTITY_PHASE: preflight
          EXPECTED_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification';root.mkdir(exist_ok=True)
          phase=os.environ.get('IDENTITY_PHASE','final')
          canonical=subprocess.check_output(['git','diff','--binary','--full-index'])
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          for file in untracked:
           result=subprocess.run(['git','diff','--no-index','--binary','--full-index','--','/dev/null',file],capture_output=True)
           assert result.returncode==1, 'failed to inspect new file'
           canonical+=result.stdout
          (root/(phase+'.patch')).write_bytes(canonical)
          status=subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True)
          (root/(phase+'-status.txt')).write_text(status)
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()+untracked
          files={}
          for name in sorted(set(paths)):
           p=pathlib.Path(name)
           if not p.exists() and not p.is_symlink(): files[name]={'deleted':True};continue
           data=os.readlink(p).encode()if p.is_symlink()else p.read_bytes()

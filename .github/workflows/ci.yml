        IDENTITY_PHASE: preflight
        EXPECTED_SHA256: ${{ inputs.patch_sha256 }}
      run: "python - <<'PY'\nimport hashlib,json,os,pathlib,stat,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification';root.mkdir(exist_ok=True)\nphase=os.environ.get('IDENTITY_PHASE','final')\ncanonical=subprocess.check_output(['git','diff','--binary','--full-index'])\nuntracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()\nfor file in untracked:\n result=subprocess.run(['git','diff','--no-index','--binary','--full-index','--','/dev/null',file],capture_output=True)\n assert result.returncode==1, 'failed to inspect new file'\n canonical+=result.stdout\n(root/(phase+'.patch')).write_bytes(canonical)\nstatus=subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True)\n(root/(phase+'-status.txt')).write_text(status)\npaths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()+untracked\nfiles={}\nfor name in sorted(set(paths)):\n p=pathlib.Path(name)\n if not p.exists() and not p.is_symlink(): files[name]={'deleted':True};continue\n data=os.readlink(p).encode()if p.is_symlink()else p.read_bytes()\n files[name]={'sha256':hashlib.sha256(data).hexdigest(),'mode':oct(stat.S_IMODE(p.lstat().st_mode)),'bytes':len(data),'symlink':p.is_symlink()}\n(root/(phase+'-source-files.json')).write_text(json.dumps(files,indent=2)+chr(10))\nactual=hashlib.sha256(canonical).hexdigest()\n(root/(phase+'-patch-identity.json')).write_text(json.dumps({'sha256':actual,'expected':os.environ['EXPECTED_SHA256'],'serializer':'git diff --binary --full-index plus untracked no-index binary full-index','including_untracked_files':True},indent=2)+chr(10))\nsubprocess.run(['git','diff','--check'],check=True)\nassert actual==os.environ['EXPECTED_SHA256'], 'qualification patch identity mismatch; actual patch/status/source hashes retained'\nprint(phase+' reviewed patch SHA-256:',actual)\n\nPY\n"
    - name: Focused regressions pass on candidate
      run: "python - <<'PY'\nimport json,os,pathlib,re,subprocess\nSPECS=[{'owner': 'commands::run::tests::windows_dotted_harness_name_launches_its_own_pathext_sibling', 'command': ['cargo', 'test', '--locked', '-p', 'ai-memory-cli', '--bin', 'ai-memory', 'commands::run::tests::windows_dotted_harness_name_launches_its_own_pathext_sibling', '--', '--exact', '--nocapture'], 'assertion_marker': 'PATHEXT must preserve the complete dotted harness name', 'independent_control': 'NATIVE_WINDOWS_CONTROL=intended-harness'}]\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification'\nclean={k:v for k,v in os.environ.items() if k not in {'GITHUB_TOKEN','GH_TOKEN'} and not k.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_'))}\nresults=[]\nfor i,spec in enumerate(SPECS):\n result=subprocess.run(spec['command'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=2100,env=clean)\n (root/f'focused-{i}.log').write_text(result.stdout); print(result.stdout)\n assert spec['independent_control'] in result.stdout\n assert result.returncode==0\n assert re.findall(r'^running (\\d+) tests?\\s*$',result.stdout,re.M)==['1']\n assert f\"test {spec['owner']} ... ok\" in result.stdout\n assert 'test result: ok. 1 passed; 0 failed;' in result.stdout\n results.append({'command':spec['command'],'owner':spec['owner'],'exit':result.returncode})\n(root/'focused-results.json').write_text(json.dumps(results,indent=2))\n\nPY\n"
    - name: Existing Windows extensionless shim control
      run: cargo test --locked -p ai-memory-cli --bin ai-memory commands::run::tests::windows_resolution_skips_the_extension_less_shim -- --exact --nocapture
    - name: Exact final full-index identity
      env:
        IDENTITY_PHASE: final
        EXPECTED_SHA256: ${{ inputs.patch_sha256 }}
      run: "python - <<'PY'\nimport hashlib,json,os,pathlib,stat,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification';root.mkdir(exist_ok=True)\nphase=os.environ.get('IDENTITY_PHASE','final')\ncanonical=subprocess.check_output(['git','diff','--binary','--full-index'])\nuntracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()\nfor file in untracked:\n result=subprocess.run(['git','diff','--no-index','--binary','--full-index','--','/dev/null',file],capture_output=True)\n assert result.returncode==1, 'failed to inspect new file'\n canonical+=result.stdout\n(root/(phase+'.patch')).write_bytes(canonical)\nstatus=subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True)\n(root/(phase+'-status.txt')).write_text(status)\npaths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()+untracked\nfiles={}\nfor name in sorted(set(paths)):\n p=pathlib.Path(name)\n if not p.exists() and not p.is_symlink(): files[name]={'deleted':True};continue\n data=os.readlink(p).encode()if p.is_symlink()else p.read_bytes()\n files[name]={'sha256':hashlib.sha256(data).hexdigest(),'mode':oct(stat.S_IMODE(p.lstat().st_mode)),'bytes':len(data),'symlink':p.is_symlink()}\n(root/(phase+'-source-files.json')).write_text(json.dumps(files,indent=2)+chr(10))\nactual=hashlib.sha256(canonical).hexdigest()\n(root/(phase+'-patch-identity.json')).write_text(json.dumps({'sha256':actual,'expected':os.environ['EXPECTED_SHA256'],'serializer':'git diff --binary --full-index plus untracked no-index binary full-index','including_untracked_files':True},indent=2)+chr(10))\nsubprocess.run(['git','diff','--check'],check=True)\nassert actual==os.environ['EXPECTED_SHA256'], 'qualification patch identity mismatch; actual patch/status/source hashes retained'\nprint(phase+' reviewed patch SHA-256:',actual)\n\nPY\n"
    - name: Preserve native receipts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dotted-pathext-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ai-memory-qualification/
        if-no-files-found: error
        retention-days: 14
    defaults:
      run:
        shell: bash
'on':
  workflow_dispatch:
    inputs:
      candidate:
        type: choice
        options:
        - dotted-pathext
        required: true
      base:
        type: string
        required: true
      patch_base64:
        type: string
        required: true
      patch_sha256:
        type: string
        required: true
      tests_patch_base64:
        type: string
        required: true
      tests_patch_sha256:
        type: string
        required: true

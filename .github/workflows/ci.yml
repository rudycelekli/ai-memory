name: OKF directory qualification
on:
  workflow_dispatch:
    inputs:
      candidate:
        type: choice
        options: [okf-directory]
        required: true
      base:
        type: string
        required: true
      patch_base64:
        type: string
        required: true
      patch_sha256:
        type: string
        required: true
      tests_patch_base64:
        type: string
        required: true
      tests_patch_sha256:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: okf-directory-qualification
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
  TAILWIND_BUILD: "1"
jobs:
  baseline:
    if: github.repository == 'rudycelekli/ai-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: akitaonrails/ai-memory
          ref: 58296ae09ed467c3345503492130eacf7142a18d
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: ai-native-1.95
      - name: Verify and apply reviewed packet
        env:
          MODE: baseline
          BASE: ${{ inputs.base }}
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
          TESTS_PATCH_BASE64: ${{ inputs.tests_patch_base64 }}
          TESTS_PATCH_SHA256: ${{ inputs.tests_patch_sha256 }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          M={'base': '58296ae09ed467c3345503492130eacf7142a18d', 'candidate': {'sha256': '54f6f1eb4f4915b5bd44c17fdc3c838abc9ffd434bbf2baa8ecc7f594e919994', 'paths': ['CHANGELOG.md', 'crates/ai-memory-mcp/src/admin.rs', 'crates/ai-memory-wiki/src/lib.rs', 'crates/ai-memory-wiki/src/migrations/m2026_09_okf_conformance.rs', 'crates/ai-memory-wiki/src/okf_index.rs'], 'bytes': 10944}, 'tests': {'sha256': '0dad9ca7428a386eb0b88791ed1d397a8347ff7c569f032c6975c68156c3c4f4', 'paths': ['crates/ai-memory-mcp/src/admin.rs', 'crates/ai-memory-wiki/src/migrations/m2026_09_okf_conformance.rs'], 'bytes': 6277}, 'independent_review_receipt': '/Users/rudycelekli/Downloads/RLGYM/upstream-prs-2026-09/campaign-records/manual-40-ai-memory-opencode-20261017/ai-memory/ordinary-postmerge-screen/independent-export-index/FINAL-REVIEW.json', 'independent_review_receipt_sha256': '4a431eb00b69d587dd17e046436643b00f78660fb675f5f72206bb63eece922a', 'baseline_tests': [{'owner': 'admin::tests::export_okf_directory_index_links_are_clickable', 'assertion_marker': 'rendered directory link missing or changed: team notes', 'command': ['cargo', 'test', '--locked', '-p', 'ai-memory-mcp', '--lib', 'admin::tests::export_okf_directory_index_links_are_clickable', '--', '--exact', '--nocapture']}, {'owner': 'migrations::m2026_09_okf_conformance::tests::bundle_index_escapes_directory_links_and_preserves_existing_index', 'assertion_marker': 'migration directory destination must be URL encoded', 'command': ['cargo', 'test', '--locked', '-p', 'ai-memory-wiki', '--lib', 'migrations::m2026_09_okf_conformance::tests::bundle_index_escapes_directory_links_and_preserves_existing_index', '--', '--exact', '--nocapture']}]}
          mode=os.environ['MODE']; key='tests' if mode=='baseline' else 'candidate'; item=M[key]
          assert os.environ['BASE']==M['base']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==M['base']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          raw=base64.b64decode(os.environ['TESTS_PATCH_BASE64' if mode=='baseline' else 'PATCH_BASE64'],validate=True)
          assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256']
          assert os.environ['TESTS_PATCH_SHA256' if mode=='baseline' else 'PATCH_SHA256']==item['sha256']
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification'; root.mkdir(exist_ok=True)
          p=root/'applied.patch'; p.write_bytes(raw)
          paths=[s.split('\t',2)[2] for s in subprocess.check_output(['git','apply','--numstat',str(p)],text=True).splitlines()]
          assert len(paths)==len(set(paths)) and set(paths)==set(item['paths'])
          subprocess.run(['git','apply','--check',str(p)],check=True); subprocess.run(['git','apply',str(p)],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          (root/'metadata.json').write_text(json.dumps({'base':M['base'],'mode':mode,'patch_sha256':item['sha256'],'paths':paths,'workflow_commit':os.environ['GITHUB_SHA'],'source_commit_pushed':False},indent=2))
          
          PY
      - name: Record compiler and resources
        run: |
          rustc --version
          cargo --version
          rustc --version | grep '^rustc 1.95.'
          df -h .
      - name: Require exact semantic baseline failures
        run: |
          python3 - <<'PY'
          """Semantic baseline validator shared verbatim with the generated workflow."""
          import re
          
          def validate_baseline_result(spec, returncode, log):
              owner = spec['owner']
              marker = spec['assertion_marker']
              assert returncode == 101, 'expected Cargo test failure exit 101'
              assert owner and marker, 'reviewed semantic assertion required'
              assert re.findall(r'^running (\d+) tests?\s*$', log, re.M) == ['1'], 'exactly one native test must be selected'
              failed = re.findall(r'^test (\S+) \.\.\. FAILED\s*$', log, re.M)
              assert failed == [owner], 'only the exact requested native test may fail'
              summaries = re.findall(r'^test result: (.+)$', log, re.M)
              assert len(summaries) == 1 and re.fullmatch(r'FAILED\. 0 passed; 1 failed; \d+ ignored; \d+ measured; \d+ filtered out; finished in [0-9.]+s', summaries[0]), 'exact one-failure native summary required'
              panic_owners = re.findall(r"^thread '([^']+)'(?: \(\d+\))? panicked at .+$", log, re.M)
              assert panic_owners == [owner], 'one panic owned by requested native test required'
              assert marker in log, 'expected semantic assertion not observed'
              forbidden = ('could not compile', 'error[E', 'failed to run custom build command', 'failed to download', 'failed to get ', 'process didn\'t exit successfully', 'signal: ', 'failed to load', 'unresolved import')
              assert not any(item in log for item in forbidden), 'compiler or infrastructure failure is not regression proof'
              return {'owner': owner, 'returncode': returncode, 'semantic_assertion': marker}
          
          import json,os,pathlib,subprocess
          SPECS=[{'owner': 'admin::tests::export_okf_directory_index_links_are_clickable', 'assertion_marker': 'rendered directory link missing or changed: team notes', 'command': ['cargo', 'test', '--locked', '-p', 'ai-memory-mcp', '--lib', 'admin::tests::export_okf_directory_index_links_are_clickable', '--', '--exact', '--nocapture']}, {'owner': 'migrations::m2026_09_okf_conformance::tests::bundle_index_escapes_directory_links_and_preserves_existing_index', 'assertion_marker': 'migration directory destination must be URL encoded', 'command': ['cargo', 'test', '--locked', '-p', 'ai-memory-wiki', '--lib', 'migrations::m2026_09_okf_conformance::tests::bundle_index_escapes_directory_links_and_preserves_existing_index', '--', '--exact', '--nocapture']}]
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-memory-qualification'
          clean={k:v for k,v in os.environ.items() if k not in {'GITHUB_TOKEN','GH_TOKEN'} and not k.startswith(('OPENAI_','ANTHROPIC_','AWS_','AZURE_','GOOGLE_','GEMINI_','AI_MEMORY_'))}
          results=[]
          for i,spec in enumerate(SPECS):
           result=subprocess.run(spec['command'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=2100,env=clean)
           (root/f'baseline-{i}.log').write_text(result.stdout); print(result.stdout)
           results.append(validate_baseline_result(spec,result.returncode,result.stdout))
          (root/'baseline-results.json').write_text(json.dumps(results,indent=2))
          
          PY
      - name: Preserve native receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: okf-directory-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-memory-qualification/
          if-no-files-found: error
          retention-days: 14
  candidate:
    if: github.repository == 'rudycelekli/ai-memory'
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:

name: dotted PATHEXT native reproduction
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - name: Preserve canonical LF source
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: akitaonrails/ai-memory
        ref: 11ab1003d9ef3788f5fc40b87fff54abf7f17dc0
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: 1.95.0
    - name: Exact production resolver launches wrong dotted command
      shell: bash
      run: 'python - <<''PY''

        from pathlib import Path

        import base64,hashlib,subprocess,re,json

        source=Path(''crates/ai-memory-cli/src/commands/run.rs'').read_bytes()

        assert hashlib.sha256(source).hexdigest()==''8931da5d37103e3c76b979ae48265eb85b90ee3787392a040c8735e606a5c2ec''

        s=source.decode();a=s.index(''pub(super) fn resolve_program('');z=s.index(''\nfn
        user_supplied_grok_rules'',a)

        actual=s[a:z].replace(''pub(super) fn resolve_program'',''fn resolve_program'')

        probe=base64.b64decode('''').decode();a=probe.index(''fn
        resolve_program'');z=probe.index(''\n#[test]'',a);assert probe[a:z]==actual

        Path(''native-receipts'').mkdir(exist_ok=True);Path(''native-receipts/probe.rs'').write_text(probe)

        subprocess.run([''rustc'',''+1.95.0'',''--edition=2024'',''--test'',''native-receipts/probe.rs'',''-o'',''native-receipts/probe.exe''],check=True)

        r=subprocess.run([''native-receipts/probe.exe'',''--exact'',''dotted_harness_name_launches_its_own_pathext_sibling'',''--nocapture''],capture_output=True,text=True);log=r.stdout+r.stderr;Path(''native-receipts/baseline.log'').write_text(log);print(log)

        assert r.returncode==101

        assert ''PATHEXT must preserve the complete dotted harness name'' in log

        assert ''wrong-harness'' in log and ''intended-harness'' in log

        assert ''NATIVE_WINDOWS_CONTROL=intended-harness'' in log

        assert re.search(r''test result: FAILED\. 0 passed; 1 failed;'',log)

        Path(''native-receipts/result.json'').write_text(json.dumps({''base'':''11ab1003d9ef3788f5fc40b87fff54abf7f17dc0'',''returncode'':r.returncode,''meaning'':''Exact
        current production resolver selected and launched wrong same-directory command
        for dotted name'',''scope'':''Native Windows function+actualprocess proof
        only, not Cargo/workspace final qualification'',''source_sha256'':''8931da5d37103e3c76b979ae48265eb85b90ee3787392a040c8735e606a5c2ec''},indent=2))


        PY'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: dotted-pathext-baseline-${{ github.run_id }}
        path: native-receipts
